<app-hero-film (time)="t.set($event)" />

<main class="page" [style.--rt]="t()">
  <app-header class="hdr" />

  <section class="hero">
    <img class="brand r1" src="hero/logo.png" alt="airtel" />
    <h1 class="title r2">PEYTO CHECKER</h1>
    <p class="tag r3">Automated network feasibility,<br />from LSI to protected path.</p>
    <a class="cta r4" routerLink="/console">Upload LSI Excel <i class="fa-solid fa-arrow-right"></i></a>
  </section>

  <footer class="stats r5">
    @if (t() > 15.6) {
      @for (s of stats(); track s.label; let i = $index) {
        <div class="stat">
          <span class="value" [countUp]="s.value" [decimals]="s.dec" [suffix]="s.suffix"
                [duration]="1400 + i * 80" [delay]="i * 90"></span>
          <span class="label">{{ s.label }}</span>
        </div>
      }
    }
  </footer>
</main>
