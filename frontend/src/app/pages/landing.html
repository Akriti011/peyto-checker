<video #vid class="bg-video" src="hero/hero.mp4" autoplay [muted]="true" playsinline preload="auto"
       (ended)="onVideoEnd()" (timeupdate)="onTime(vid)"></video>
<div class="scrim" [class.on]="ended()"></div>

<main class="page" [class.show]="ended()">
  <app-header class="hdr" [showLogo]="false" />

  <section class="hero">
    <img class="brand" src="assets/airtel-logo-white.svg" alt="airtel" />
    <h1 class="title">PEYTO CHECKER</h1>
    <p class="tag">Automated network feasibility,<br />from LSI to protected path.</p>
    <a class="cta" routerLink="/console">Upload LSI Excel <i class="fa-solid fa-arrow-right"></i></a>
  </section>

  <footer class="stats">
    @if (ended()) {
      @for (s of stats(); track s.label; let i = $index) {
        <div class="stat">
          <span class="value" [countUp]="s.value" [decimals]="s.dec" [suffix]="s.suffix"
                [duration]="1400 + i * 80" [delay]="i * 90"></span>
          <span class="label">{{ s.label }}</span>
        </div>
      }
    }
  </footer>
</main>

@if (!ended()) {
  <button class="skip" type="button" (click)="skip(vid)">Skip intro</button>
}
